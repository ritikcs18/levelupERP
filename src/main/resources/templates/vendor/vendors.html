<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Vendor Management - ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<!-- Main Container -->
<main class="container-fluid flex-grow-1 py-4">
  <div class="row d-flex align-items-stretch h-100">
    <!-- Sidebar -->
    <div sec:authorize="hasAnyRole('ADMIN', 'SALES', 'OPS')" class="col-md-2 d-flex flex-shrink-0">
      <div class="sidebar-container sidebar w-100 p-3 bg-light border-end">
        <div class="sidebar-title">Actions</div>
        <div class="nav flex-column">
          <a class="nav-link active" href="#"><i class="bi bi-card-list"></i> View</a>
          <a class="nav-link" th:href="@{/vendors/add}"><i class="bi bi-plus-circle"></i> Add</a>
          <a class="nav-link" href="#"><i class="bi bi-pencil-square"></i> Update</a>
          <a class="nav-link" href="#"><i class="bi bi-trash3"></i> Delete</a>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="col d-flex flex-column" style="min-width: 0;">
      <h4 class="text-primary mb-3">Vendor List</h4>

      <!-- Search -->
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Search vendor...">
      </div>

      <!-- Vendor Table -->
      <div class="table-responsive scroll-container border rounded p-2 flex-grow-1" style="max-height: 500px; overflow-x: auto;">
        <table class="table table-bordered table-hover table-sm mb-0 text-nowrap small-table">
          <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Code</th>
            <th>Business Type</th>
            <th>Country</th>
            <th>City</th>
            <th>Address</th>
            <th>Pin Code</th>
            <th>Email</th>
            <th>Contact</th>
            <th>GST</th>
            <th>Is Active</th>
            <th>OnBoard Date</th>
            <th>Plants</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${vendors.isEmpty()}">
            <td colspan="13" class="text-center text-muted">No vendors found.</td>
          </tr>
          <tr th:each="vendor : ${vendors}">
            <td th:text="${vendor.id}">1</td>
            <td th:text="${vendor.name}">Vendor Name</td>
            <td th:text="${vendor.vendorCode}">VN001</td>
            <td th:text="${vendor.businessTypeName}"></td>
            <td th:text="${vendor.country}">India</td>
            <td th:text="${vendor.city}">Mumbai</td>
            <td th:text="${vendor.address}">123 Street</td>
            <td th:text="${vendor.pinCode}">400001</td>
            <td th:text="${vendor.email}">email@example.com</td>
            <td th:text="${vendor.contactNumber}">9876543210</td>
            <td th:text="${vendor.gstNumber}">27ABCDE1234F1Z5</td>
            <td th:text="${vendor.active ? 'Yes' : 'No'}">Yes</td>
            <td th:text="${vendor.onboardingDate != null ? #temporals.format(vendor.onboardingDate, 'dd-MM-yyyy') : 'N/A'}">14-07-2025</td>
            <td th:text="${vendor.vendorPlants != null ? #strings.listJoin(vendor.vendorPlants, ', ') : '-'}"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
