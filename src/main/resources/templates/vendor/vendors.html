<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Vendor Management - ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-4">
  <div class="row">

    <div sec:authorize="hasAnyRole('ADMIN', 'SALES', 'OPS')" class="col-md-2">
      <div class="bg-white shadow-sm p-3 rounded-end h-100 border-end">
        <h6 class="text-uppercase fw-bold text-secondary border-bottom pb-2 mb-3">Actions</h6>
        <div class="nav flex-column gap-2">
          <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded"
             th:classappend="${param.mode == 'view'} ? 'bg-primary text-white' : 'btn btn-outline-primary'"
             th:href="@{/vendors(mode='view')}">
            <i class="bi bi-card-list"></i> View Vendors
          </a>

          <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded"
             th:classappend="${param.mode == 'add'} ? 'bg-primary text-white' : 'btn btn-outline-primary'"
             th:href="@{/vendors(mode='add')}">
            <i class="bi bi-plus-circle"></i> Add Vendor
          </a>

          <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded btn btn-outline-secondary disabled">
            <i class="bi bi-pencil-square"></i> Update (Coming Soon)
          </a>

          <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded btn btn-outline-secondary disabled">
            <i class="bi bi-trash3"></i> Delete (Coming Soon)
          </a>
        </div>
      </div>
    </div>



    <!-- Main Content -->
    <div class="col-md-10">

      <!-- Vendor Form (mode=add) -->
      <div th:if="${showAddForm}">
        <h4 class="mb-3">Add New Vendor</h4>
        <form th:action="@{/vendors/add}" th:object="${vendorDTO}" method="post">
          <div class="row g-3">
            <!-- Name -->
            <div class="col-md-6">
              <label class="form-label">Name *</label>
              <input type="text" th:field="*{name}" class="form-control" required />
            </div>

            <!-- Vendor Code -->
            <div class="col-md-6">
              <label class="form-label">Vendor Code *</label>
              <input type="text" th:field="*{vendorCode}" class="form-control" required />
            </div>

            <!-- Business Type -->
            <div class="col-md-6">
              <label class="form-label">Business Type *</label>
              <select th:field="*{businessTypeName}" class="form-select" required>
                <option value="">Select...</option>
                <option th:each="bt : ${businessTypes}" th:value="${bt.name}" th:text="${bt.name}"></option>
              </select>
            </div>

            <!-- Plants -->
            <div class="col-md-6">
              <label class="form-label">Plants</label>
              <select multiple th:field="*{vendorPlants}" class="form-select">
                <option th:each="plant : ${plants}" th:value="${plant.name}" th:text="${plant.name}"></option>
              </select>
              <div class="form-text">Hold Ctrl or Cmd to select multiple</div>
            </div>

            <!-- Email -->
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" th:field="*{email}" class="form-control"/>
            </div>

            <!-- Contact Number -->
            <div class="col-md-6">
              <label class="form-label">Contact Number *</label>
              <input type="text" th:field="*{contactNumber}" class="form-control" required />
            </div>

            <!-- Country -->
            <div class="col-md-6">
              <label class="form-label">Country *</label>
              <input type="text" th:field="*{country}" class="form-control" required />
            </div>

            <!-- City -->
            <div class="col-md-6">
              <label class="form-label">City *</label>
              <input type="text" th:field="*{city}" class="form-control" required />
            </div>

            <!-- Address -->
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea th:field="*{address}" class="form-control" rows="2"></textarea>
            </div>

            <!-- Pin Code -->
            <div class="col-md-6">
              <label class="form-label">Pin Code *</label>
              <input type="text" th:field="*{pinCode}" class="form-control" required />
            </div>

            <!-- GST Number -->
            <div class="col-md-6">
              <label class="form-label">GST Number *</label>
              <input type="text" th:field="*{gstNumber}" class="form-control" required />
            </div>

            <!-- Onboarding Date -->
            <div class="col-md-6">
              <label class="form-label">Onboarding Date *</label>
              <input type="date" th:field="*{onboardingDate}" class="form-control" required />
            </div>

            <!-- Is Active -->
            <div class="col-md-6 d-flex align-items-center">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" th:field="*{active}" />
                <label class="form-check-label">Is Active</label>
              </div>
            </div>

            <!-- Account Number -->
            <div class="col-md-6">
              <label class="form-label">Account Number</label>
              <input type="text" th:field="*{accountNumber}" class="form-control" />
            </div>

            <!-- IFSC Code -->
            <div class="col-md-6">
              <label class="form-label">IFSC Code</label>
              <input type="text" th:field="*{ifscCode}" class="form-control" />
            </div>

            <!-- Submit -->
            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-primary">Add Vendor</button>
              <a class="btn btn-secondary" th:href="@{/vendors(mode='view')}">Cancel</a>
            </div>
          </div>
        </form>
      </div>

      <!-- Vendor Table (mode=view or default) -->
      <div th:if="${!showAddForm}">
        <h4 class="mb-3 text-primary">Vendor List</h4>

        <form th:action="@{/vendors/search}" method="get" class="mb-3 d-flex flex-wrap align-items-center gap-2">
          <div class="flex-grow-1">
            <input id="vendorSearchInput"
                   type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control border-0 border-bottom rounded-0 shadow-none"
                   placeholder="Search by Name or Code" />
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/vendors(mode='view')}" class="btn btn-outline-secondary">Reset</a>
          </div>
        </form>

        <div id="vendorTable" class="table-responsive border rounded p-2" style="max-height: 500px; overflow: auto;">
          <table  class="table table-bordered table-sm table-hover text-nowrap mb-0">
            <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Code</th>
              <th>Business Type</th>
              <th>Country</th>
              <th>City</th>
              <th>Address</th>
              <th>Pin Code</th>
              <th>Email</th>
              <th>Contact</th>
              <th>GST</th>
              <th>Is Active</th>
              <th>Onboard Date</th>
              <th>Plants</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${vendors.isEmpty()}">
              <td colspan="14" class="text-center text-muted">No vendors found.</td>
            </tr>
            <tr th:each="vendor : ${vendors}">
              <td th:text="${vendor.id}"></td>
              <td th:text="${vendor.name}"></td>
              <td th:text="${vendor.vendorCode}"></td>
              <td th:text="${vendor.businessTypeName}"></td>
              <td th:text="${vendor.country}"></td>
              <td th:text="${vendor.city}"></td>
              <td th:text="${vendor.address}"></td>
              <td th:text="${vendor.pinCode}"></td>
              <td th:text="${vendor.email}"></td>
              <td th:text="${vendor.contactNumber}"></td>
              <td th:text="${vendor.gstNumber}"></td>
              <td th:text="${vendor.active ? 'Yes' : 'No'}"></td>
              <td th:text="${vendor.onboardingDate != null ? #temporals.format(vendor.onboardingDate, 'dd-MM-yyyy') : 'N/A'}"></td>
              <td th:text="${vendor.vendorPlants != null ? #strings.listJoin(vendor.vendorPlants, ', ') : '-'}"></td>
            </tr>
            </tbody>

          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
