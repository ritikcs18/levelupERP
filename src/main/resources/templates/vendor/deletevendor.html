<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Delete Vendor - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vendor-theme.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-3">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 bg-white shadow-sm p-3 rounded-end sidebar-full-height">
            <h5 class="mb-4">Vendor Actions</h5>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/add}"><i class="bi bi-plus-lg"></i> Add Vendor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/view}"><i class="bi bi-eye me-1"></i>View Vendors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/update}"><i class="bi bi-eye me-1"></i>Update Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/delete}"><i class="bi bi-eye me-1"></i>Delete Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/upload}"><i class="bi bi-eye me-1"></i>Bulk Upload</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->

        <div class="col-md-10 d-flex flex-column" style="height: calc(100vh - 120px); overflow: auto;">
            <h4 class="mb-3">Delete Vendor</h4>

            <form th:action="@{/vendors/deleteVendor}" method="post" class="row g-3">
                <input type="hidden" name="_method" value="delete" />

                <div class="col-md-6">
                    <label for="vendorCodeDelete" class="form-label">Vendor Code</label>
                    <input type="text" class="form-control" id="vendorCodeDelete" name="code" required>
                </div>

                <!-- Spacer div to push button to next line and align -->
                <div class="col-12">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>

            <div th:if="${deleteSuccess}" class="alert alert-success mt-3">Vendor deleted successfully.</div>
            <div th:if="${deleteError}" class="alert alert-danger mt-3" th:text="${deleteError}"></div>
        </div>


    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
