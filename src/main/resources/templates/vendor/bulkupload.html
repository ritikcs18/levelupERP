<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Add Vendor - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vendor-theme.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-3">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 bg-white shadow-sm p-3 rounded-end sidebar-full-height">
            <h5 class="mb-4">Vendor Actions</h5>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/add}"><i class="bi bi-plus-lg"></i> Add Vendor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/view}"><i class="bi bi-eye me-1"></i>View Vendors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/update}"><i class="bi bi-eye me-1"></i>Update Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/delete}"><i class="bi bi-eye me-1"></i>Delete Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/upload}"><i class="bi bi-eye me-1"></i>Bulk Upload</a>
                </li>

            </ul>
        </nav>

        <!-- Main Content -->
        <div class="col-md-10 d-flex flex-column" style="height: calc(100vh - 120px); overflow: auto;">
            <h4 class="mb-3">Bulk Upload Vendors</h4>
            <p class="text-muted">Upload a CSV file to create multiple vendors in bulk.</p>

            <form th:action="@{/vendors/bulkUpload}" method="post" enctype="multipart/form-data" class="row g-3">
                <div class="col-md-6">
                    <label for="csvFile" class="form-label">Choose CSV File</label>
                    <input type="file" class="form-control" id="csvFile" name="file" accept=".csv" required>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>
            </form>

            <div th:if="${uploadSuccess}" class="alert alert-success mt-3" th:text="${uploadSuccess}"></div>
            <div th:if="${uploadError}" class="alert alert-danger mt-3" th:text="${uploadError}"></div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
