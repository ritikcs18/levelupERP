<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>View Vendors - ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/vendor-theme.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css}" />
  <style>

  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<!-- Page Content -->
<main class="container-fluid flex-grow-1 py-3">
  <div class="row">

    <!-- Sidebar -->
    <nav class="col-md-2 bg-white shadow-sm p-3 rounded-end sidebar-full-height">
      <h5 class="mb-4">Vendor Actions</h5>
      <ul class="nav flex-column gap-2">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/vendors/add}"><i class="bi bi-plus-lg"></i> Add Vendor</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/vendors/view}"><i class="bi bi-eye me-1"></i>View Vendors</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/vendors/update}"><i class="bi bi-eye me-1"></i>Update Vendors</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" th:href="@{/vendors/delete}"><i class="bi bi-eye me-1"></i>Delete Vendors</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" th:href="@{/vendors/upload}"><i class="bi bi-eye me-1"></i>Bulk Upload</a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <div class="col-md-10">
      <!-- Search Bar -->
      <form th:action="@{/vendors/view}" method="get" class="mb-3 d-flex flex-wrap align-items-center gap-2">
        <input type="hidden" name="mode" value="view"/>
        <div class="flex-grow-1">
          <input type="text"
                 name="keyword"
                 th:value="${keyword}"
                 class="form-control border-0 border-bottom rounded-0 shadow-none"
                 placeholder="Search by Name or Code" />
        </div>
        <button type="submit" class="btn btn-outline-primary btn-sm">Search</button>
      </form>

      <!-- Vendor Table -->
      <div id="vendorTable" class="table-responsive border rounded p-2">
        <table class="table table-bordered table-sm table-hover text-nowrap mb-0">
          <thead class="table-light sticky-top">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Code</th>
            <th>Business Type</th>
            <th>Country</th>
            <th>City</th>
            <th>Address</th>
            <th>Pin Code</th>
            <th>Email</th>
            <th>ISD</th>
            <th>Contact</th>
            <th>GST</th>
            <th>Govt ID</th>
            <th>Region</th>
            <th>Bank Account</th>
            <th>Ifsc Code</th>
            <th>Active</th>
            <th>Onboard Date</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${vendors.isEmpty()}">
            <td colspan="16" class="text-center text-muted">No vendors found.</td>
          </tr>
          <tr th:each="vendor : ${vendors}">
            <td th:text="${vendor.id}"></td>
            <td th:text="${vendor.name}"></td>
            <td th:text="${vendor.vendorCode}"></td>
            <td th:text="${vendor.businessTypeCode}"></td>
            <td th:text="${vendor.country}"></td>
            <td th:text="${vendor.city}"></td>
            <td th:text="${vendor.address}"></td>
            <td th:text="${vendor.pincode}"></td>
            <td th:text="${vendor.email}"></td>
            <td th:text="${vendor.isdCode}"></td>
            <td th:text="${vendor.contactNumber}"></td>
            <td th:text="${vendor.gstNumber}"></td>
            <td th:text="${vendor.govtId}"></td>
            <td th:text="${vendor.region}"></td>
            <td th:text="${vendor.accountNumber}"></td>
            <td th:text="${vendor.ifscCode}"></td>
            <td th:text="${vendor.active ? 'Yes' : 'No'}"></td>
            <td th:text="${vendor.onboardingDate != null ? #temporals.format(vendor.onboardingDate, 'dd-MM-yyyy') : 'N/A'}"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
