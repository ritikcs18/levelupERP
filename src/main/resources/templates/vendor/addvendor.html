<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Add Vendor - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vendor-theme.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-3">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 bg-white shadow-sm p-3 rounded-end sidebar-full-height">
            <h5 class="mb-4">Vendor Actions</h5>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/add}"><i class="bi bi-plus-lg"></i> Add Vendor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/view}"><i class="bi bi-eye me-1"></i>View Vendors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/update}"><i class="bi bi-eye me-1"></i>Update Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/delete}"><i class="bi bi-eye me-1"></i>Delete Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/upload}"><i class="bi bi-eye me-1"></i>Bulk Upload</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="col-md-10 d-flex flex-column" style="height: calc(100vh - 120px); overflow: auto;">
            <h4 class="mb-3">Add New Vendor</h4>
            <form th:action="@{/vendors/add}" th:object="${vendorDTO}" method="post">
                <div th:if="${successMessage}" class="alert alert-success" role="alert">
                    <span th:text="${successMessage}"></span>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Name *</label>
                        <input type="text" th:field="*{name}" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Business Type *</label>
                        <select th:field="*{businessTypeCode}" class="form-select" required>
                            <option value="">Select...</option>
                            <option th:each="bt : ${businessTypes}" th:value="${bt.code}" th:text="${bt.code}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control"/>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">ISD Code</label>
                        <input type="text" th:field="*{isdCode}" class="form-control"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Contact Number *</label>
                        <input type="text" th:field="*{contactNumber}" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Region</label>
                        <input type="text" th:field="*{region}" class="form-control"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Country *</label>
                        <input type="text" th:field="*{country}" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">City *</label>
                        <input type="text" th:field="*{city}" class="form-control" required />
                    </div>

                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea th:field="*{address}" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Pin Code *</label>
                        <input type="text" th:field="*{pincode}" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">GST Number *</label>
                        <input type="text" th:field="*{gstNumber}" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Govt ID</label>
                        <input type="text" th:field="*{govtId}" class="form-control"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Payment Currency</label>
                        <input type="text" th:field="*{paymentCurrency}" class="form-control"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Onboarding Date *</label>
                        <input type="date" th:field="*{onboardingDate}" class="form-control" required />
                    </div>

                    <div class="col-md-6 d-flex align-items-center">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{active}" />
                            <label class="form-check-label">Is Active</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Account Number</label>
                        <input type="text" th:field="*{accountNumber}" class="form-control" />
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">IFSC Code</label>
                        <input type="text" th:field="*{ifscCode}" class="form-control" />
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary">Add Vendor</button>
                        <a class="btn btn-secondary" th:href="@{/vendors/view}">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
