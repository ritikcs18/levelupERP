<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Vendor</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
<div class="container mt-4">
    <h3 class="text-primary mb-4">Add Vendor</h3>

    <form th:action="@{/vendors/add}" th:object="${vendorDTO}" method="post">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required/>
            </div>

            <div class="col-md-6">
                <label class="form-label">Vendor Code</label>
                <input type="text" th:field="*{vendorCode}" class="form-control" required/>
            </div>

            <div class="col-md-6">
                <label class="form-label">Business Type</label>
                <select th:field="*{businessTypeName}" class="form-select" required>
                    <option value="">Select...</option>
                    <option th:each="bt : ${businessTypes}"
                            th:value="${bt.name}"
                            th:text="${bt.name}">
                    </option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Plants</label>
                <select multiple th:field="*{vendorPlants}" class="form-select">
                    <option th:each="plant : ${plants}"
                            th:value="${plant.name}"
                            th:text="${plant.name}">
                    </option>
                </select>
                <div class="form-text">Hold Ctrl or Cmd to select multiple</div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label class="form-label">Contact Number</label>
                <input type="text" th:field="*{contactNumber}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label class="form-label">Country</label>
                <input type="text" th:field="*{country}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label class="form-label">City</label>
                <input type="text" th:field="*{city}" class="form-control"/>
            </div>

            <div class="col-12">
                <label class="form-label">Address</label>
                <textarea th:field="*{address}" class="form-control" rows="2"></textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">Pin Code</label>
                <input type="text" th:field="*{pinCode}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label class="form-label">GST Number</label>
                <input type="text" th:field="*{gstNumber}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label class="form-label">Onboarding Date</label>
                <input type="date" th:field="*{onboardingDate}" class="form-control"/>
            </div>

            <div class="col-md-6 d-flex align-items-center">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" th:field="*{active}" />
                    <label class="form-check-label">Is Active</label>
                </div>
            </div>
        </div>


        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Add Vendor</button>
        </div>
    </form>
</div>
</body>
</html>
