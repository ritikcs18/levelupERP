<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Update Vendor - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vendor-theme.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-3">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 bg-white shadow-sm p-3 rounded-end sidebar-full-height">
            <h5 class="mb-4">Vendor Actions</h5>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/add}"><i class="bi bi-plus-lg"></i> Add Vendor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/view}"><i class="bi bi-eye me-1"></i>View Vendors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/update}"><i class="bi bi-eye me-1"></i>Update Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/delete}"><i class="bi bi-eye me-1"></i>Delete Vendors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/vendors/upload}"><i class="bi bi-eye me-1"></i>Bulk Upload</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="col-md-10 d-flex flex-column" style="height: calc(100vh - 120px); overflow: auto;">
            <h4 class="mb-3">Update Vendor</h4>
            <form th:action="@{/vendors/update}" th:object="${vendorDTO}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Name *</label>
                        <input type="text" th:field="*{name}" id="name" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label for="vendorCode" class="form-label">Vendor Code *</label>
                        <input type="text" th:field="*{vendorCode}" id="vendorCode" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label for="businessType" class="form-label">Business Type *</label>
                        <select th:field="*{businessTypeCode}" id="businessType" class="form-select" required>
                            <option value="">Select...</option>
                            <option th:each="bt : ${businessTypes}" th:value="${bt.code}" th:text="${bt.code}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" th:field="*{email}" id="email" class="form-control" />
                    </div>

                    <div class="col-md-3">
                        <label for="isdCode" class="form-label">ISD Code</label>
                        <input type="text" th:field="*{isdCode}" id="isdCode" class="form-control" />
                    </div>

                    <div class="col-md-6">
                        <label for="contactNumber" class="form-label">Contact Number *</label>
                        <input type="text" th:field="*{contactNumber}" id="contactNumber" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label for="region" class="form-label">Region</label>
                        <input type="text" th:field="*{region}" id="region" class="form-control" />
                    </div>

                    <div class="col-md-6">
                        <label for="country" class="form-label">Country *</label>
                        <input type="text" th:field="*{country}" id="country" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label for="city" class="form-label">City *</label>
                        <input type="text" th:field="*{city}" id="city" class="form-control" required />
                    </div>

                    <div class="col-12">
                        <label for="address" class="form-label">Address</label>
                        <textarea th:field="*{address}" id="address" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label for="pincode" class="form-label">Pin Code *</label>
                        <input type="text" th:field="*{pincode}" id="pincode" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label for="gstNumber" class="form-label">GST Number *</label>
                        <input type="text" th:field="*{gstNumber}" id="gstNumber" class="form-control" required />
                    </div>

                    <div class="col-md-6">
                        <label for="govtId" class="form-label">Govt ID</label>
                        <input type="text" th:field="*{govtId}" id="govtId" class="form-control" />
                    </div>

                    <div class="col-md-6">
                        <label for="paymentCurrency" class="form-label">Payment Currency</label>
                        <input type="text" th:field="*{paymentCurrency}" id="paymentCurrency" class="form-control" />
                    </div>

                    <div class="col-md-6">
                        <label for="onboardingDate" class="form-label">Onboarding Date *</label>
                        <input type="date" th:field="*{onboardingDate}" id="onboardingDate" class="form-control" required />
                    </div>

                    <div class="col-md-6 d-flex align-items-center">
                        <div class="form-check">
                            <input type="checkbox" th:field="*{active}" id="active" class="form-check-input" />
                            <label for="active" class="form-check-label">Is Active</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="accountNumber" class="form-label">Account Number</label>
                        <input type="text" th:field="*{accountNumber}" id="accountNumber" class="form-control" />
                    </div>

                    <div class="col-md-6">
                        <label for="ifscCode" class="form-label">IFSC Code</label>
                        <input type="text" th:field="*{ifscCode}" id="ifscCode" class="form-control" />
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary">Update Vendor</button>
                        <a class="btn btn-secondary" th:href="@{/vendors/view}">Cancel</a>
                    </div>
                </div>
            </form>

        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

<script>
    // Utility function to safely set values to inputs
    function safeSet(id, value) {
        const el = document.getElementById(id);
        if (el && value !== undefined && value !== null) {
            el.value = value;
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const vendorCodeInput = document.getElementById("vendorCode");

        vendorCodeInput.addEventListener("blur", function () {
            const code = vendorCodeInput.value.trim();

            if (code) {
                fetch(`/api/vendors/${code}`) // This should return VendorDTO as JSON
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("Vendor not found");
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Fill form fields safely
                        safeSet("id", data.id);
                        safeSet("name", data.name);
                        safeSet("address", data.address);
                        safeSet("city", data.city);
                        safeSet("region", data.region);
                        safeSet("country", data.country);
                        safeSet("pincode", data.pincode);
                        safeSet("govtId", data.govtId);
                        safeSet("gstNumber", data.gstNumber);
                        safeSet("email", data.email);
                        safeSet("paymentCurrency", data.paymentCurrency);
                        safeSet("purchasingGroup", data.purchasingGroup);
                        safeSet("onboardingDate", data.onboardingDate);
                        safeSet("exitDate", data.exitDate);
                        safeSet("isdCode", data.isdCode);
                        safeSet("contactNumber", data.contactNumber);
                        safeSet("businessTypeCode", data.businessTypeCode);

                        // For nested bank account fields (if bankAccount exists)
                        if (data.accountNumber) {
                            safeSet("accountNumber", data.accountNumber);
                        }
                        if (data.ifscCode) {
                            safeSet("ifscCode", data.ifscCode);
                        }

                        // For checkbox (handle separately)
                        const activeCheckbox = document.getElementById("active");
                        if (activeCheckbox) {
                            activeCheckbox.checked = !!data.active; // convert to boolean
                        }
                    })
                    .catch(error => {
                        alert("Vendor not found or server error");
                        console.error("Fetch error:", error);
                    });
            }
        });
    });
</script>
