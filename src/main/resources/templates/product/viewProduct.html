<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Product Management - ERP</title>
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom Theme -->
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/product.css}" />
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-4">
    <div class="row d-flex align-items-stretch h-100">

        <!-- Sidebar -->
        <div sec:authorize="hasAnyRole('ADMIN', 'SALES')" class="col-md-2">
            <div class="bg-white shadow-sm p-3 rounded-end h-100 border sidebar-container">
                <h6 class="fw-bold border-bottom pb-2 mb-3">Actions</h6>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/product/view}"><i class="bi bi-eye"></i> View Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-plus-lg"></i> Add Product</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-pencil-square"></i> Update Product</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-trash"></i> Delete Product</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col d-flex flex-column">
            <h4 class="text-primary mb-3">Product List</h4>

            <!-- Search Bar -->
            <form th:action="@{/product/view}" method="get" class="mb-3 d-flex flex-wrap align-items-center gap-2">
                <input type="hidden" name="mode" value="view"/>
                <div class="flex-grow-1">
                    <input type="text"
                           name="keyword"
                           th:value="${keyword}"
                           class="form-control border-0 border-bottom rounded-0 shadow-none"
                           placeholder="Search by Name or Code" />
                </div>
                <button type="submit" class="btn btn-outline-primary btn-sm">Search</button>
            </form>


            <!-- Product Table -->
            <div class="table-responsive scroll-container border rounded p-2 flex-grow-1 bg-white shadow-sm">
                <table class="table table-bordered table-hover table-sm mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Description</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>101</td>
                        <td>Printer</td>
                        <td>Electronics</td>
                        <td>₹5,999</td>
                        <td>23</td>
                        <td>Compact all-in-one printer</td>
                    </tr>
                    <tr>
                        <td>102</td>
                        <td>Packaging Box</td>
                        <td>Packaging</td>
                        <td>₹35</td>
                        <td>120</td>
                        <td>Kraft paper eco-friendly box</td>
                    </tr>
                    <!-- More rows... -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
