<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" >
<head>
    <meta charset="UTF-8">
    <title>Product Management - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-4">
    <div class="row d-flex align-items-stretch h-100">

        <!-- Sidebar -->
        <div sec:authorize="hasAnyRole('ADMIN', 'SALES')" class="col-md-2 d-flex">
            <div class="sidebar-container sidebar w-100 p-3 bg-light border-end">
                <div class="sidebar-title">Actions</div>
                <div class="nav flex-column gap-2">
                    <a class="nav-link active" href="#"><i class="bi bi-card-list"></i> View</a>
                    <a class="nav-link" href="#"><i class="bi bi-plus-circle"></i> Add</a>
                    <a class="nav-link" href="#"><i class="bi bi-pencil-square"></i> Update</a>
                    <a class="nav-link" href="#"><i class="bi bi-trash3"></i> Delete</a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col d-flex flex-column">
            <h4 class="text-primary mb-3">Product List</h4>

            <!-- Search -->
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Search product...">
            </div>

            <!-- Product Table -->
            <div class="table-responsive scroll-container border rounded p-2 flex-grow-1">
                <table class="table table-bordered table-hover table-sm mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Description</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>101</td>
                        <td>Printer</td>
                        <td>Electronics</td>
                        <td>₹5,999</td>
                        <td>23</td>
                        <td>Compact all-in-one printer</td>
                    </tr>
                    <tr>
                        <td>102</td>
                        <td>Monitor</td>
                        <td>Electronics</td>
                        <td>₹8,499</td>
                        <td>12</td>
                        <td>24-inch HD monitor</td>
                    </tr>
                    <!-- More sample rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
