<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ERP</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Theme -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<!-- Login Card -->
<div class="container-fluid d-flex justify-content-center align-items-center bg-light" style="min-height: 90vh;">
    <div class="card shadow-lg" style="width: 100%; max-width: 900px; border-radius: 1rem; overflow: hidden;">
        <div class="row g-0">
            <!-- Left Side - Info Panel -->
            <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-white p-4" style="background-color: #0056b3;">
                <h2 class="mb-3">Welcome to ERP</h2>
                <p class="text-white-50 text-center">
                    Streamline your organization’s operations with ease. Login to manage purchases, vendors, inventory, and more.
                </p>
                <!-- Optional Image -->
                <!-- <img src="/images/erp-logo.png" alt="ERP Logo" class="img-fluid mt-3" style="max-height: 100px;"> -->
            </div>

            <!-- Right Side - Login Form -->
            <div class="col-md-6 p-5">
                <h3 class="text-center mb-4 text-primary">ERP Login</h3>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
