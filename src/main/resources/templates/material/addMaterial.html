<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Finished Materials - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/material-theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-3">
    <div class="row">

        <!-- Sidebar -->
        <div sec:authorize="hasAnyRole('ADMIN', 'OPS')" class="col-md-2">
            <div class="bg-white shadow-sm p-3 rounded-end sidebar-full-height">
                <h5 class="mb-4">Material Actions</h5>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/add}">
                            <i class="bi bi-plus-lg"></i> Add Material
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/view}">
                            <i class="bi bi-eye me-1"></i> View Material
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/delete}">
                            <i class="bi bi-upload"></i> Delete Material
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/upload}">
                            <i class="bi bi-upload"></i> Bulk Upload
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">
            <form th:action="@{/materials/add}" th:object="${finishedMaterialDTO}" method="post" class="row g-3 border rounded p-4 bg-light shadow-sm">
                <h5 class="mb-3">Add Finished Material</h5>

                <div th:if="${successMessage}" class="alert alert-success" role="alert">
                    <span th:text="${successMessage}"></span>
                </div>

                <!-- Plant -->
                <div class="col-md-4">
                    <label for="plant" class="form-label">Plant</label>
                    <input type="text" th:field="*{plant}" class="form-control" required />
                </div>

                <!-- Header Material -->
                <div class="col-md-4">
                    <label for="headerMaterial" class="form-label">Header Material</label>
                    <input type="text" th:field="*{headerMaterial}" class="form-control" required />
                </div>

                <!-- Sub Material -->
                <div class="col-md-4">
                    <label for="subMaterial" class="form-label">Sub Material</label>
                    <input type="text" th:field="*{subMaterial}" class="form-control" />
                </div>

                <!-- Material Description -->
                <div class="col-md-6">
                    <label for="materialDescription" class="form-label">Material Description</label>
                    <input type="text" th:field="*{materialDescription}" class="form-control" />
                </div>

                <!-- Material Type Description -->
                <div class="col-md-6">
                    <label for="materialTypeDescription" class="form-label">Material Type</label>
                    <input type="text" th:field="*{materialTypeDescription}" class="form-control" />
                </div>

                <!-- Material Group -->
                <div class="col-md-4">
                    <label for="materialGroup" class="form-label">Material Group</label>
                    <input type="text" th:field="*{materialGroup}" class="form-control" />
                </div>

                <!-- Base Unit -->
                <div class="col-md-4">
                    <label for="baseUnitOfMeasure" class="form-label">Base UOM</label>
                    <input type="text" th:field="*{baseUnitOfMeasure}" class="form-control" />
                </div>

                <!-- MRP Type -->
                <div class="col-md-4">
                    <label for="mrpType" class="form-label">MRP Type</label>
                    <input type="text" th:field="*{mrpType}" class="form-control" />
                </div>

                <!-- Currency -->
                <div class="col-md-4">
                    <label for="currency" class="form-label">Currency</label>
                    <input type="text" th:field="*{currency}" class="form-control" />
                </div>

                <!-- NLP -->
                <div class="col-md-4">
                    <label for="nlp" class="form-label">NLP</label>
                    <input type="text" th:field="*{nlp}" class="form-control" />
                </div>

                <!-- Artwork Number -->
                <div class="col-md-4">
                    <label for="artworkNumber" class="form-label">Artwork Number</label>
                    <input type="text" th:field="*{artworkNumber}" class="form-control" />
                </div>

                <!-- Artwork Revision No -->
                <div class="col-md-4">
                    <label for="artworkRevisionNo" class="form-label">Artwork Rev. No</label>
                    <input type="text" th:field="*{artworkRevisionNo}" class="form-control" />
                </div>

                <!-- Technical Spec No -->
                <div class="col-md-4">
                    <label for="technicalSpecNo" class="form-label">Tech Spec No</label>
                    <input type="text" th:field="*{technicalSpecNo}" class="form-control" />
                </div>

                <!-- Technical Spec Rev No -->
                <div class="col-md-4">
                    <label for="technicalSpecRevisionNo" class="form-label">Tech Spec Rev</label>
                    <input type="text" th:field="*{technicalSpecRevisionNo}" class="form-control" />
                </div>

                <!-- Purchasing Group -->
                <div class="col-md-4">
                    <label for="purchasingGroup" class="form-label">Purchasing Group</label>
                    <input type="text" th:field="*{purchasingGroup}" class="form-control" />
                </div>

                <!-- Valuation Class -->
                <div class="col-md-4">
                    <label for="valuationClass" class="form-label">Valuation Class</label>
                    <input type="text" th:field="*{valuationClass}" class="form-control" />
                </div>

                <!-- GTIN -->
                <div class="col-md-4">
                    <label for="gtinNumber" class="form-label">GTIN</label>
                    <input type="text" th:field="*{gtinNumber}" class="form-control" />
                </div>

                <!-- Submit Button -->
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">Save Material</button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
