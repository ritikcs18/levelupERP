<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Finished Materials - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/material-theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-3">
    <div class="row">

        <!-- Sidebar -->
        <div sec:authorize="hasAnyRole('ADMIN', 'OPS')" class="col-md-2">
            <div class="bg-white shadow-sm p-3 rounded-end sidebar-full-height">
                <h5 class="mb-4">Material Actions</h5>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/add}">
                            <i class="bi bi-plus-lg"></i> Add Material
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/view}">
                            <i class="bi bi-eye me-1"></i> View Material
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/delete}">
                            <i class="bi bi-upload"></i> Delete Material
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/materials/upload}">
                            <i class="bi bi-upload"></i> Bulk Upload
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->

        <div class="col-md-10 d-flex flex-column" style="height: calc(100vh - 120px); overflow: auto;">
            <h4 class="mb-3">Delete Material</h4>

            <form th:action="@{/delete}" method="post" class="row g-3">
                <input type="hidden" name="_method" value="delete" />

                <div class="col-md-6">
                    <label for="headerMaterialDelete" class="form-label">Header Material</label>
                    <input type="text" class="form-control" id="headerMaterialDelete" name="code" required>
                </div>

                <!-- Spacer div to push button to next line and align -->
                <div class="col-12">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>

            <div th:if="${deleteSuccess}" class="alert alert-success mt-3">Header Material deleted successfully.</div>
            <div th:if="${deleteError}" class="alert alert-danger mt-3" th:text="${deleteError}"></div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
