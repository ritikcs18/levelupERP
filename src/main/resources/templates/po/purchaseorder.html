<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PO Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .form-section-title {
            background-color: #f1f1f1;
            font-weight: bold;
            padding: 6px 10px;
            margin-top: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="fragments/header :: header"></div>
<main class="container-fluid flex-grow-1 py-4">
    <div class="row d-flex align-items-stretch h-100">

        <!-- Sidebar -->
        <div sec:authorize="hasRole('ADMIN') or hasRole('SALES')" class="col-md-2 d-flex">
            <div class="sidebar-container sidebar w-100 p-3 bg-light border-end">
                <div class="sidebar-title">Actions</div>
                <div class="nav flex-column">
                    <a class="nav-link active" href="#"><i class="bi bi-card-list"></i> View</a>
                    <a class="nav-link" href="#"><i class="bi bi-plus-circle"></i> Add</a>
                    <a class="nav-link" href="#"><i class="bi bi-pencil-square"></i> Update</a>
                    <a class="nav-link" href="#"><i class="bi bi-trash3"></i> Delete</a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">
            <div class="content p-4">

                <h4 class="text-primary mb-4">Create Purchase Order</h4>

                <form th:object="${purchaseOrderDTO}" method="post" action="/po/save">

                    <!-- PO Info -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">PO No.</label>
                            <input type="text" class="form-control" placeholder="PO Number">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">PO Date</label>
                            <input type="date" class="form-control">
                        </div>
                    </div>

                    <!-- Bill To and Ship To -->
                    <div class="form-section-title">Bill To / Ship To</div>
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Bill To</h6>
                            <input class="form-control mb-2" placeholder="Customer Name">
                            <input class="form-control mb-2" placeholder="Address">
                            <input class="form-control mb-2" placeholder="Contact Person">
                            <input class="form-control mb-2" placeholder="Phone No.">
                            <input class="form-control mb-2" placeholder="Email ID">
                            <textarea class="form-control mb-2" placeholder="Special Instruction (if any)"></textarea>
                        </div>
                        <div class="col-md-6">
                            <h6>Ship To</h6>
                            <input class="form-control mb-2" placeholder="Customer Name">
                            <input class="form-control mb-2" placeholder="Address">
                            <input class="form-control mb-2" placeholder="Contact Person">
                            <input class="form-control mb-2" placeholder="Phone No.">
                            <input class="form-control mb-2" placeholder="Email ID">
                            <textarea class="form-control mb-2" placeholder="Specify documents required (if any)"></textarea>
                        </div>
                    </div>

                    <!-- Vendor Info -->
                    <div class="card p-4 mb-4">
                        <h5 class="mb-3 text-primary">Vendor Details (Bill To)</h5>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorCode" class="form-label">Select Vendor Code</label>
                                <select id="vendorCode" class="form-select" th:field="*{vendorCode}">
                                    <option value="">-- Select Vendor Code --</option>
                                    <option th:each="vendor : ${vendors}"
                                            th:value="${vendor.vendorCode}"
                                            th:text="${vendor.vendorCode}">V001</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Vendor Name</label>
                                <input type="text" class="form-control" id="vendorName" placeholder="Vendor Name" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contact Person</label>
                                <input type="text" class="form-control" id="vendorContact" placeholder="Contact Person" readonly>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Phone No.</label>
                                <input type="text" class="form-control" id="vendorPhone" placeholder="Phone No." readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email ID</label>
                                <input type="email" class="form-control" id="vendorEmail" placeholder="Email ID" readonly>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label">Vendor Address</label>
                                <input type="text" class="form-control" id="vendorAddress" placeholder="Vendor Address" readonly>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">GST Number</label>
                                <input type="text" class="form-control" id="vendorGst" placeholder="GST Number" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Plant Name</label>
                                <select class="form-select" id="vendorPlant">
                                    <option value="">-- Select Plant --</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label">Special Instruction (Optional)</label>
                                <textarea class="form-control" placeholder="Enter any special instructions here..." rows="2"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Delivery Info -->
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <label class="form-label">Currency</label>
                            <input class="form-control" placeholder="e.g., USD, CHF">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Mode of Delivery</label>
                            <input class="form-control" placeholder="e.g., AIR, SEA">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Term of Delivery</label>
                            <input class="form-control" placeholder="e.g., CIF, FOB">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-4">
                            <label class="form-label">Port of Discharge</label>
                            <input class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Place of Final Destination</label>
                            <input class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Payment Term</label>
                            <input class="form-control">
                        </div>
                    </div>

                    <!-- Order Table -->
                    <div class="form-section-title mt-4">Order Details</div>
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>Sr. No.</th>
                            <th>Item Code / Description</th>
                            <th>Quantity</th>
                            <th>UOM</th>
                            <th>Unit Price</th>
                            <th>Amount</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="i : ${#numbers.sequence(1, 3)}">
                            <td><input class="form-control" th:value="${i}"></td>
                            <td><input class="form-control"></td>
                            <td><input class="form-control"></td>
                            <td><input class="form-control" value="EA"></td>
                            <td><input class="form-control"></td>
                            <td><input class="form-control"></td>
                        </tr>
                        </tbody>
                    </table>

                    <!-- Summary -->
                    <div class="form-section-title">Order Summary</div>
                    <div class="row">
                        <div class="col-md-6">
                            <textarea class="form-control" placeholder="Additional Notes (if any)"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label>Total Amount</label>
                            <input class="form-control mb-2" placeholder="$ 0.00">
                            <label>Total Amount (in words)</label>
                            <input class="form-control" placeholder="e.g., Five Hundred Fifty-Five Dollars Only">
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary px-5">Create PO</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const vendorCodeSelect = document.getElementById("vendorCode");

        vendorCodeSelect.addEventListener("change", function () {
            const selectedCode = vendorCodeSelect.value;

            if (!selectedCode) {
                clearVendorFields();
                clearPlantDropdown();
                return;
            }

            // Fetch vendor basic details
            fetch(`/api/vendors/${selectedCode}`)
                .then(response => {
                    if (!response.ok) throw new Error("Vendor not found");
                    return response.json();
                })
                .then(data => {
                    document.getElementById("vendorName").value = data.name || '';
                    document.getElementById("vendorAddress").value = data.address || '';
                    document.getElementById("vendorGst").value = data.gstNumber || '';
                    // Do NOT set vendorPlant here since it's a dropdown now
                })
                .catch(error => {
                    clearVendorFields();
                    alert("Failed to fetch vendor details");
                    console.error(error);
                });

            // Fetch vendor plants and populate dropdown
            fetch(`/api/vendors/${selectedCode}/plants`)
                .then(res => {
                    if (!res.ok) throw new Error("Failed to fetch plants");
                    return res.json();
                })
                .then(plants => {
                    const select = document.getElementById("vendorPlant");
                    select.innerHTML = '<option value="">-- Select Plant --</option>';
                    plants.forEach(p => {
                        const option = document.createElement("option");
                        option.value = p.id;
                        option.textContent = p.name;
                        select.appendChild(option);
                    });
                })
                .catch(err => {
                    clearPlantDropdown();
                    alert("Error fetching plant list");
                    console.error(err);
                });
        });

        function clearVendorFields() {
            document.getElementById("vendorName").value = '';
            document.getElementById("vendorAddress").value = '';
            document.getElementById("vendorGst").value = '';
        }

        function clearPlantDropdown() {
            const select = document.getElementById("vendorPlant");
            select.innerHTML = '<option value="">-- Select Plant --</option>';
        }
    });
</script>
