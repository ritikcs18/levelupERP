<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Add PO - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/po-theme.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-3">
    <div class="row">

        <!-- Sidebar -->
        <div sec:authorize="hasAnyRole('ADMIN', 'OPS')" class="col-md-2">
            <div class="po-sidebar shadow-sm rounded-end">
                <h5 class="mb-4">PO Actions</h5>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/po/add}">
                            <i class="bi bi-plus-lg"></i> Add PO
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/po/view}">
                            <i class="bi bi-eye"></i> View PO
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/po/delete}">
                            <i class="bi bi-upload"></i> Po Delete
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <!-- Main Content -->
        <div class="col-md-10 d-flex flex-column" style="height: calc(100vh - 120px); overflow: auto;">
            <h4 class="mb-3">Create a new Purchase Order</h4>

            <form th:action="@{/po/save}" th:object="${puchaseOrderDTO}" method="post">
                <div class="row g-3">

                    <!-- Vendor Code-->
                    <div class="col-md-6">
                        <label class="form-label">Vendor Code</label>
                        <input type="text" class="form-control" th:field="*{vendorCode}">
                    </div>


                    <!--  Head Office -->
                    <div class="col-md-6">
                        <label class="form-label">Bill To</label>
                        <select class="form-select" th:field="*{billToId}">
                            <option value="">-- Select Head Office --</option>
                            <option th:each="ho : ${headOffices}" th:value="${ho.id}" th:text="${ho.name}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Ship To</label>
                        <select class="form-select" th:field="*{shipToPlantId}">
                            <option value="">-- Select Plant --</option>
                            <option th:each="plant : ${plants}"
                                    th:value="${plant.id}"
                                    th:text="${plant.code}">
                            </option>
                        </select>
                    </div>


                    <!-- PO Number -->
                    <div class="col-md-6">
                        <label class="form-label">PO Number</label>
                        <input type="text" class="form-control" th:field="*{poNumber}">
                    </div>

                    <!-- PO Date -->
                    <div class="col-md-6">
                        <label class="form-label">PO Date</label>
                        <input type="date" class="form-control" th:field="*{poDate}">
                    </div>

                    <!-- Currency -->
                    <div class="col-md-6">
                        <label class="form-label">Currency</label>
                        <input type="text" class="form-control" th:field="*{poCurrency}">
                    </div>

                    <!-- Mode of Delivery -->
                    <div class="col-md-6">
                        <label class="form-label">Mode of Delivery</label>
                        <select class="form-select" id="modeofDeliverySelect" th:field="*{modeOfDilivery}">
                            <option value="">-- Select Payment Term --</option>
                            <option value="AIR">AIR</option>
                            <option value="WATER">WATER</option>
                            <option value="ROAD">ROAD</option>
                        </select>
                    </div>

                    <!-- Term of Delivery -->
                    <div class="col-md-6">
                        <label class="form-label">Term of Delivery</label>
                        <select class="form-select" id="termOfDiliverySelect" th:field="*{termOfDilivery}">
                            <option value="">-- Select Term Of Dilivery --</option>
                            <option value="CIF">CIF - Cost Insurance & Freight/option>
                            <option value="EXW">EXW - Ex Works</option>
                            <option value="FOB">FOB - Free on Board</option>
                            <option value="DAT">DAT - Delivered at Terminal</option>
                            <option value="DAP">DAP - Delivered at Place</option>
                            <option value="DDP">DDP - Delivered Duty Paid</option>
                        </select>
                    </div>

                    <!-- Port of Discharge -->
                    <div class="col-md-6">
                        <label class="form-label">Port of Discharge</label>
                        <input type="text" class="form-control" th:field="*{portOfDischarge}">
                    </div>

                    <!-- Final Destination -->
                    <div class="col-md-6">
                        <label class="form-label">Place of Final Destination</label>
                        <input type="text" class="form-control" th:field="*{placeOfFinalDestination}">
                    </div>

                </div>


                <!-- Sub Materials Table -->
                <div class="table-responsive">
                    <table class="table table-bordered align-middle" id="subMaterialTable">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Sub Material</th>
                            <th>Description</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Unit Price</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="subMaterialBody">
                        <tr>
                            <td>1</td>
                            <td>
                                <select class="form-select sub-material-dropdown" name="lifOfSubMaterial[0].itemCode">
                                    <option value="">-- Select Sub Material --</option>
                                </select>
                            </td>
                            <td><input type="text" class="form-control" name="lifOfSubMaterial[0].description" readonly/></td>
                            <!-- ✅ Added qty-field class here -->
                            <td><input type="number" class="form-control qty-field" name="lifOfSubMaterial[0].quantity" min="1"/></td>
                            <td><input type="text" class="form-control unit-field" name="lifOfSubMaterial[0].unitOfMeasurement" readonly/></td>
                            <td><input type="number" step="0.01" class="form-control price-field" name="lifOfSubMaterial[0].unitPrice" readonly/></td>
                            <td><button type="button" class="btn btn-danger btn-sm remove-row">X</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Add New Row Button -->
                <div class="mb-3">
                    <button type="button" class="btn btn-success" id="addRowBtn">+ Add New Material</button>
                </div>

<!--                &lt;!&ndash; Payment Term &ndash;&gt;-->
<!--                <div class="col-md-6">-->
<!--                    <label class="form-label">Payment Term</label>-->
<!--                    <select class="form-select" id="paymentTermSelect" th:field="*{paymentTerm}">-->
<!--                        <option value="">&#45;&#45; Select Payment Term &#45;&#45;</option>-->
<!--                        <option value="DAP">DAP</option>-->
<!--                        <option value="LC">LC</option>-->
<!--                        <option value="100% Advance">100% Advance</option>-->
<!--                        <option value="Other">Other</option>-->
<!--                    </select>-->
<!--                    &lt;!&ndash; Hidden text field for custom payment term &ndash;&gt;-->
<!--                    <input type="text" id="customPaymentTerm" class="form-control mt-2 d-none" placeholder="Enter custom payment term">-->
<!--                </div>-->

                <!-- Payment Term -->
                <div class="col-md-6">
                    <label class="form-label">Payment Term</label>
                    <select class="form-select" id="paymentTermSelect" th:field="*{paymentTerm}">
                        <option value="">-- Select Payment Term --</option>
                        <option value="DAP">DAP</option>
                        <option value="LC">LC</option>
                        <option value="100% Advance">100% Advance</option>
                        <option value="Other">Other</option>
                    </select>
                    <!-- Hidden text field for custom payment term -->
                    <input type="text" id="customPaymentTerm" class="form-control mt-2 d-none"
                           placeholder="Enter custom payment term">
                </div>




                <!-- Total Amount -->
                <div class="col-md-6">
                    <label class="form-label">Total Amount</label>
                    <input type="number" step="0.01" class="form-control" id="totalAmount" th:field="*{totalAmount}" readonly>
                </div>

                <!-- Total Amount in Words -->
                <div class="col-md-12">
                    <label class="form-label">Amount in Words</label>
                    <input type="text" class="form-control" id="amountInWords" th:field="*{totalAmountInWords}" readonly>
                </div>

                <!-- Additional Notes -->
                <div class="col-md-12">
                    <label class="form-label">Additional Notes</label>
                    <textarea class="form-control" th:field="*{additionalNotes}" rows="3"></textarea>
                </div>

                <!-- Submit -->
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary">Submit Purchase Order</button>
                </div>

            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        let subMaterialList = [];

        // ✅ Fetch FinishedMaterialDTO list from API
        fetch("/api/materials/submaterials")
            .then(response => response.json())
            .then(data => {
                subMaterialList = data;
                const firstDropdown = document.querySelector(".sub-material-dropdown");
                populateDropdown(firstDropdown);
            })
            .catch(err => console.error("Error fetching sub materials:", err));

        function populateDropdown(dropdown) {
            dropdown.innerHTML = '<option value="">-- Select Sub Material --</option>';
            subMaterialList.forEach(item => {
                const option = document.createElement("option");
                option.value = item.subMaterial;
                option.textContent = `${item.subMaterial} - ${item.materialDescription}`;
                dropdown.appendChild(option);
            });
        }

        // ✅ Autofill fields on sub-material selection
        document.getElementById("subMaterialBody").addEventListener("change", (e) => {
            if (e.target.classList.contains("sub-material-dropdown")) {
                const selectedCode = e.target.value;
                const selectedItem = subMaterialList.find(item => item.subMaterial === selectedCode);
                if (selectedItem) {
                    const row = e.target.closest("tr");
                    row.querySelector("input[name*='.description']").value = selectedItem.materialDescription;
                    row.querySelector(".unit-field").value = selectedItem.baseUnitOfMeasure;
                    row.querySelector(".price-field").value = selectedItem.nlp;
                }
            }
            calculateTotalAmount();
        });

        // ✅ Add new row dynamically
        document.getElementById("addRowBtn").addEventListener("click", () => {
            const tableBody = document.getElementById("subMaterialBody");
            const rowCount = tableBody.rows.length;

            const newRow = `
        <tr>
            <td>${rowCount + 1}</td>
            <td>
                <select class="form-select sub-material-dropdown" name="lifOfSubMaterial[${rowCount}].itemCode">
                    <option value="">-- Select Sub Material --</option>
                </select>
            </td>
            <td><input type="text" class="form-control" name="lifOfSubMaterial[${rowCount}].description" readonly/></td>
            <td><input type="number" class="form-control qty-field" name="lifOfSubMaterial[${rowCount}].quantity" min="1"/></td>
            <td><input type="text" class="form-control unit-field" name="lifOfSubMaterial[${rowCount}].unitOfMeasurement" readonly/></td>
            <td><input type="number" step="0.01" class="form-control price-field" name="lifOfSubMaterial[${rowCount}].unitPrice" readonly/></td>
            <td><button type="button" class="btn btn-danger btn-sm remove-row">X</button></td>
        </tr>`;

            tableBody.insertAdjacentHTML("beforeend", newRow);
            populateDropdown(tableBody.lastElementChild.querySelector(".sub-material-dropdown"));
        });

        // ✅ Remove row
        document.getElementById("subMaterialBody").addEventListener("click", (e) => {
            if (e.target.classList.contains("remove-row")) {
                e.target.closest("tr").remove();
                updateSerialNumbers();
                calculateTotalAmount();
            }
        });

        // ✅ Update serial numbers
        function updateSerialNumbers() {
            document.querySelectorAll("#subMaterialBody tr").forEach((row, index) => {
                row.cells[0].textContent = index + 1;
            });
        }

        // ✅ Calculate total amount and convert to words
        function calculateTotalAmount() {
            let total = 0;
            document.querySelectorAll("#subMaterialBody tr").forEach(row => {
                const qty = parseFloat(row.querySelector(".qty-field")?.value) || 0;
                const price = parseFloat(row.querySelector(".price-field")?.value) || 0;
                total += qty * price;
            });
            document.getElementById("totalAmount").value = total.toFixed(2);
            document.getElementById("amountInWords").value = numberToWords(total);
        }

        // ✅ Convert number to words (basic implementation)
        function numberToWords(num) {
            if (num === 0) return "Zero";
            const a = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen",
                "Seventeen", "Eighteen", "Nineteen"];
            const b = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

            function inWords(n) {
                if (n < 20) return a[n];
                if (n < 100) return b[Math.floor(n / 10)] + (n % 10 ? " " + a[n % 10] : "");
                if (n < 1000) return a[Math.floor(n / 100)] + " Hundred " + (n % 100 !== 0 ? inWords(n % 100) : "");
                if (n < 100000) return inWords(Math.floor(n / 1000)) + " Thousand " + inWords(n % 1000);
                return n; // For simplicity beyond lakh
            }
            return inWords(Math.floor(num)) + " Only";
        }

        // ✅ Payment term "Other" toggle
        document.getElementById("paymentTermSelect").addEventListener("change", (e) => {
            const customField = document.getElementById("customPaymentTerm");
            if (e.target.value === "Other") {
                customField.classList.remove("d-none");
                customField.setAttribute("name", "paymentTerm"); // bind to form
            } else {
                customField.classList.add("d-none");
                customField.removeAttribute("name");
            }
        });

        // ✅ Recalculate on quantity input change
        document.getElementById("subMaterialBody").addEventListener("input", (e) => {
            if (e.target.classList.contains("qty-field")) {
                calculateTotalAmount();
            }
        });

        // ✅ Run calculation on page load to handle first row
        calculateTotalAmount();
    });

    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const downloadPo = urlParams.get("download");

        if (downloadPo) {
            // Trigger PDF download
            window.location.href = '/po/' + downloadPo + '/pdf';

            // Remove the query param from URL (clean refresh)
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });


    const paymentSelect = document.getElementById("paymentTermSelect");
    const customInput = document.getElementById("customPaymentTerm");

    paymentSelect.addEventListener("change", function () {
        if (this.value === "Other") {
            customInput.classList.remove("d-none");
            customInput.setAttribute("name", "paymentTerm"); // bind to same DTO field
            paymentSelect.removeAttribute("name"); // avoid duplicate
        } else {
            customInput.classList.add("d-none");
            customInput.removeAttribute("name");
            paymentSelect.setAttribute("name", "paymentTerm");
        }
    });


</script>
