<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Purchase Order Management - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/po-theme.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<main class="container-fluid flex-grow-1 py-4">
    <div class="row">

        <!-- Sidebar -->
        <div sec:authorize="hasAnyRole('ADMIN', 'OPS')" class="col-md-2">
            <div class="po-sidebar shadow-sm rounded-end">
                <h5 class="mb-4">PO Actions</h5>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/po/add}">
                            <i class="bi bi-plus-lg"></i> Add PO
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/po/view}">
                            <i class="bi bi-eye"></i> View PO
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/po/delete}">
                            <i class="bi bi-upload"></i> Po Delete
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Content Area -->
        <div class="col-md-10 po-content">
            <!-- Search Bar -->
            <form th:action="@{/po/view}" method="get" class="mb-3 d-flex flex-wrap align-items-center gap-2">
                <div class="flex-grow-1">
                    <input type="text"
                           name="keyword"
                           th:value="${keyword}"
                           class="form-control border-0 border-bottom rounded-0 shadow-none"
                           placeholder="Search by PO Number, Vendor Code, or Plant" />
                </div>
                <button type="submit" class="btn btn-outline-primary btn-sm">Search</button>
            </form>

            <!-- PO Table -->
            <div class="po-table-container table-responsive border rounded p-2">
                <table id="poTable" class="table table-bordered table-sm table-hover text-nowrap mb-0">
                    <thead class="table-light sticky-top">
                    <tr>
                        <th>PO Number</th>
                        <th>PO Date</th>
                        <th>Vendor Code</th>
                        <th>Bill To (Head Office)</th>
                        <th>Ship To (Plant)</th>
                        <th>Currency</th>
                        <th>Mode of Delivery</th>
                        <th>Payment Term</th>
                        <th>Total Amount</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${purchaseOrderDTO.isEmpty()}">
                        <td colspan="10" class="text-center text-muted">No Purchase Orders found.</td>
                    </tr>
                    <tr th:each="po : ${purchaseOrderDTO}">
                        <td th:text="${po.poNumber}"></td>
                        <td th:text="${#temporals.format(po.poDate, 'dd-MM-yyyy')}"></td>
                        <td th:text="${po.vendorCode}"></td>
                        <td th:text="${po.billToId}"></td>
                        <td th:text="${po.shipToPlantId}"></td>
                        <td th:text="${po.poCurrency}"></td>
                        <td th:text="${po.modeOfDilivery}"></td>
                        <td th:text="${po.paymentTerm}"></td>
                        <td th:text="${po.totalAmount}"></td>
                        <td>
                            <a th:href="@{'/po/' + ${po.poNumber} + '/pdf'}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-file-earmark-pdf"></i> PDF
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>




</html>
